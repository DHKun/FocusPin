[package]
name = "app"
version = "3.0.0"
description = "FocusPin — frosted desktop widget for tasks and inspirations"
authors = ["DoHoKun"]
license = "MIT"
repository = "https://github.com/DHKun/FocusPin"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.7.0", features = ["wry"] }
tauri-plugin-log = "2"
tauri-plugin-store = "2"

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.6"
